services:
  - type: web
    name: ai-dev-pipeline
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-dev-pipeline-db
          property: connectionString
databases:
  - name: ai-dev-pipeline-db
    plan: free
    ipAllowList: []
